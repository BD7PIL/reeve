<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>REEVE 编排</title>
<style>
  /* 页面骨架 only —— 颜色、字号、圆角、控件几何**全归宿主**。
     宿主通过 applyHostReady() 把 --oc-* / --surface-* / --interactive-* 令牌写到 <html>，
     kit 在第一次挂载时自己注入控件样式（按钮/徽标/列表/进度条…）。
     这一份只留 kit 不给的**布局**：页/行/列/卡/表单网格/粘性保存条。
     （这里曾经有一整套自绘的配色与"档位块/延迟条/chip"——正是那套自绘让面板看起来像另一个 app。） */

  html, body { margin: 0; min-height: 100%; background: transparent; }
  body { font: inherit; color: inherit; }
  #root { min-height: 100%; }

  /* kit 的包装层不该成为自己的布局盒 */
  .oc-kit { display: contents; }

  .oc-page {
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 100%;
    /* 底边留 16px：宿主底部有一条圆角条带，贴太近会被压住（实测只差 10px） */
    padding: 12px 12px 16px;
  }

  .oc-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
  .oc-row-nowrap { flex-wrap: nowrap; }
  .oc-row-between { justify-content: space-between; }
  .oc-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .oc-grow { flex: 1 1 auto; min-width: 0; }
  .oc-push { margin-left: auto; }
  .oc-truncate { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .oc-card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
    padding: 10px;
    /* 面 = 宿主的高层面：深色主题里 background 与 elevated 差一档，卡必须用它才立得起来
       （上一版只画边框 —— 宿主深色的边框是 #242323bf，看着就是"没有卡"） */
    background: var(--surface-elevated, transparent);
    border: 1px solid var(--interactive-border, color-mix(in srgb, currentColor 25%, transparent));
    border-radius: var(--radius, 9px);
  }

  /* 候选列表可滚（长链不该把整页撑到几千 px） */
  .oc-list-scroll { max-height: 260px; overflow: auto; }

  .oc-form {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px 10px;
    align-items: start;
  }
  .oc-form-cell { min-width: 0; }
  .oc-form-cell-wide { grid-column: 1 / -1; }
  @media (max-width: 460px) { .oc-form { grid-template-columns: minmax(0, 1fr); } }

  .oc-xs { font-size: 11px; }
  .oc-sm { font-size: 12px; }
  .oc-nowrap { white-space: nowrap; }

  /* 一行里放数字：等宽 + 表格数字，跨行对齐 */
  .oc-num { font-family: var(--font-mono, ui-monospace, monospace); font-variant-numeric: tabular-nums; }

  .oc-ok { color: var(--status-success, #1a7f4b); }
  .oc-warn { color: var(--status-warning, #9a6a00); }
  .oc-err { color: var(--status-error, #c0392b); }
  .oc-off { color: var(--surface-muted-foreground, color-mix(in srgb, currentColor 60%, transparent)); }

  /* 摘要卡里的数字格：标签小灰字 + 数字粗体 */
  .oc-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 8px 10px; }
  .oc-stat-label { font-size: 11px; color: var(--surface-muted-foreground, currentColor); }
  .oc-stat-value { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* 统计里的一行：名字 | 次数 | 条 | 延迟（四列对齐，跨行可用同一量程比较） */
  .oc-stat-row { display: grid; grid-template-columns: minmax(0, 1.1fr) auto minmax(80px, 1.2fr) auto; align-items: center; gap: 10px; min-height: 26px; }
  .oc-stat-name { font-weight: 500; }
  .oc-stat-bar { display: flex; align-items: center; }
  .oc-stat-bar > * { flex: 1 1 auto; }
  .oc-stat-lat { text-align: right; }

  /* 保存条：只在有改动/在飞时出现，吸在底部 —— 动线是"改 → 保存 → 已生效" */
  .oc-savebar {
    position: sticky;
    bottom: 0;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border: 1px solid var(--interactive-border, color-mix(in srgb, currentColor 25%, transparent));
    border-radius: var(--radius, 9px);
    background: var(--surface-elevated, var(--background, Canvas));
  }

  /* 只给读屏的播报区（视觉上不占位） */
  .oc-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

  .oc-pre {
    margin: 0;
    max-height: 220px;
    overflow: auto;
    padding: 8px;
    border-radius: calc(var(--radius, 9px) - 2px);
    background: var(--surface-muted, color-mix(in srgb, currentColor 8%, transparent));
    font-family: var(--font-mono, ui-monospace, monospace);
    font-size: 11px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="./main.js"></script>
</body>
</html>
